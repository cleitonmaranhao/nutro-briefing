<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anamnese de Marca · Do Feed ao Consultório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#F5F2EC; --bone-cool:#ECE8DD; --ink:#0A0E14;
  --iron:#B33A3A; --gold:#9C7A3F; --sapphire:#1B2A4A;
  --slate:#4A5160; --mist:#D4D0C8;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bone); color:var(--ink);
  font-family:var(--sans); line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.wrap{max-width:760px; margin:0 auto; padding:0 24px}

/* progress bar */
#progress-shell{position:sticky; top:0; z-index:50; background:var(--bone); border-bottom:1px solid var(--mist)}
#progress-shell .wrap{display:flex; align-items:center; gap:16px; height:56px}
.brandmark{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--slate); white-space:nowrap}
.brandmark b{color:var(--iron); font-weight:700}
#progress-track{flex:1; height:2px; background:var(--mist); position:relative; overflow:hidden}
#progress-fill{position:absolute; left:0; top:0; height:100%; width:0; background:var(--iron); transition:width .4s cubic-bezier(.4,0,.2,1)}
#progress-count{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--slate); white-space:nowrap}

/* screens */
.screen{display:none; padding:56px 0 96px; animation:fade .5s ease both}
.screen.active{display:block}
@keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

/* intro */
.intro-logo{display:block; height:48px; width:auto; margin-bottom:22px}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--iron); margin-bottom:18px}
.intro-rule{width:38px; height:1px; background:var(--iron); margin-bottom:22px}
h1.title{font-family:var(--serif); font-weight:800; font-size:clamp(40px,8vw,68px); line-height:.96; letter-spacing:-.03em; margin-bottom:20px}
.lead{font-family:var(--serif); font-style:italic; font-weight:400; font-size:clamp(17px,2.4vw,21px); line-height:1.45; color:var(--slate); max-width:34em; margin-bottom:30px}
.intro-body p{font-size:15px; color:var(--ink); margin-bottom:14px; max-width:40em}
.intro-note{font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--slate); margin:26px 0 32px; padding-left:14px; border-left:2px solid var(--gold); line-height:1.7}
.intro-map{margin:30px 0 8px}
.intro-map .imlabel{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate); display:block; margin-bottom:12px}
.intro-map ol{list-style:none; counter-reset:im}
.intro-map li{counter-increment:im; font-size:13.5px; color:var(--slate); padding:7px 0 7px 34px; position:relative; line-height:1.45; border-bottom:1px solid var(--mist)}
.intro-map li:last-child{border-bottom:none}
.intro-map li::before{content:counter(im,decimal-leading-zero); position:absolute; left:0; top:7px; font-family:var(--mono); font-size:11px; color:var(--iron); font-weight:500}
.intro-map li b{color:var(--ink); font-weight:600}

/* step */
.step-kicker{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--iron); margin-bottom:14px}
.step-kicker .of{color:var(--mist)}
h2.q{font-family:var(--serif); font-weight:600; font-size:clamp(26px,4.6vw,38px); line-height:1.08; letter-spacing:-.02em; margin-bottom:16px}
.help{font-size:15px; color:var(--slate); margin-bottom:8px; max-width:40em}

/* principle callout */
.principle{background:var(--bone-cool); border-left:3px solid var(--gold); padding:16px 18px; margin:24px 0; border-radius:0 4px 4px 0}
.principle .plabel{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); display:block; margin-bottom:7px}
.principle p{font-family:var(--serif); font-style:italic; font-size:16px; line-height:1.5; color:var(--ink)}
.principle p+p{margin-top:8px}

.examples{margin:18px 0 6px}
.examples .exlabel{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate); display:block; margin-bottom:8px}
.examples ul{list-style:none}
.examples li{font-size:13.5px; color:var(--slate); padding:5px 0 5px 18px; position:relative; line-height:1.5; border-bottom:1px solid var(--mist)}
.examples li:last-child{border-bottom:none}
.examples li::before{content:''; position:absolute; left:0; top:13px; width:5px; height:5px; background:var(--iron); border-radius:50%}

/* inputs */
.field{margin-top:24px}
.field label.flabel{display:block; font-family:var(--sans); font-weight:600; font-size:13px; color:var(--ink); margin-bottom:8px}
.dica{font-size:12.5px; color:var(--slate); line-height:1.5; margin:-2px 0 9px; padding-left:13px; border-left:2px solid var(--gold); max-width:40em}
.dica b{color:var(--ink); font-weight:600}
textarea,input[type=text]{
  width:100%; font-family:var(--sans); font-size:15px; color:var(--ink);
  background:#fff; border:1px solid var(--mist); border-radius:6px;
  padding:13px 15px; resize:vertical; line-height:1.55; transition:border-color .2s,box-shadow .2s;
}
textarea{min-height:96px}
textarea:focus,input[type=text]:focus{outline:none; border-color:var(--sapphire); box-shadow:0 0 0 3px rgba(27,42,74,.08)}
textarea::placeholder,input::placeholder{color:#aeb3bd}
.charhint{font-family:var(--mono); font-size:10px; color:var(--mist); text-align:right; margin-top:5px; letter-spacing:.04em; transition:color .2s}
.charhint.ok{color:var(--gold)}

/* choice options */
.opts{display:flex; flex-direction:column; gap:10px; margin-top:8px}
.opt{display:flex; align-items:flex-start; gap:12px; padding:14px 16px; background:#fff; border:1px solid var(--mist); border-radius:6px; cursor:pointer; transition:all .18s}
.opt:hover{border-color:var(--slate)}
.opt.sel{border-color:var(--sapphire); background:#fbfaf7; box-shadow:0 0 0 2px rgba(27,42,74,.1)}
.opt .box{flex-shrink:0; width:18px; height:18px; border:1.5px solid var(--mist); margin-top:1px; display:flex; align-items:center; justify-content:center; transition:all .18s}
.opt.multi .box{border-radius:4px}
.opt.single .box{border-radius:50%}
.opt.sel .box{border-color:var(--sapphire); background:var(--sapphire)}
.opt.sel .box::after{content:''; width:7px; height:7px; background:#fff; border-radius:1px}
.opt.single.sel .box::after{border-radius:50%}
.opt .otext{font-size:14.5px; line-height:1.45}
.opt .otext b{font-weight:600}
.opt .ohint{display:block; font-size:12.5px; color:var(--slate); margin-top:3px}
.multinote{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--slate); margin-top:10px; text-transform:uppercase}
.multinote.warn{color:var(--iron)}

/* nav */
.nav{display:flex; justify-content:space-between; align-items:center; margin-top:40px; gap:16px}
button{font-family:var(--sans); cursor:pointer; border:none; transition:all .2s}
.btn-primary{background:var(--sapphire); color:var(--bone); font-weight:600; font-size:15px; padding:14px 30px; border-radius:6px; letter-spacing:.01em}
.btn-primary:hover{background:#22345c}
.btn-ghost{background:none; color:var(--slate); font-size:14px; font-weight:500; padding:14px 6px}
.btn-ghost:hover{color:var(--ink)}
.btn-ghost:disabled{opacity:0; pointer-events:none}

/* result */
.result-intro .help{margin-bottom:0}
.doc{background:#fff; border:1px solid var(--mist); border-radius:8px; padding:44px 40px; margin-top:18px}
.doc-head{border-bottom:2px solid var(--ink); padding-bottom:18px; margin-bottom:28px}
.doc-head .dk{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--iron); margin-bottom:10px}
.doc-head h3{font-family:var(--serif); font-weight:800; font-size:32px; line-height:1; letter-spacing:-.02em}
.doc-head .who{font-family:var(--serif); font-style:italic; font-size:16px; color:var(--slate); margin-top:8px}
.doc-head .dt{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--mist); margin-top:10px; text-transform:uppercase}

/* synthesized declaration */
.declar{background:var(--bone-cool); border-left:3px solid var(--iron); border-radius:0 6px 6px 0; padding:22px 24px; margin-bottom:34px}
.declar .dlabel{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--iron); display:block; margin-bottom:12px}
.declar p{font-family:var(--serif); font-size:18px; line-height:1.55; color:var(--ink)}
.declar p+p{margin-top:10px}
.declar .empty{font-style:italic; color:var(--slate); font-size:15px; font-family:var(--sans)}

/* doc thematic groups */
.doc-group{margin-bottom:30px}
.doc-group>.gtitle{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--sapphire); padding-bottom:8px; margin-bottom:16px; border-bottom:1px solid var(--mist)}
.doc-sec{margin-bottom:18px}
.doc-sec:last-child{margin-bottom:0}
.doc-sec .sk{font-family:var(--sans); font-weight:600; font-size:12.5px; color:var(--slate); margin-bottom:5px}
.doc-sec .sval{font-size:15px; line-height:1.6; color:var(--ink); white-space:pre-wrap}
.doc-sec .sval.empty{color:var(--mist); font-style:italic}

/* editorial plan */
.edplan{display:grid; gap:12px; margin-top:4px}
.edcard{border:1px solid var(--mist); border-radius:6px; padding:14px 16px; background:#fbfaf7}
.edcard .ecname{font-family:var(--sans); font-weight:600; font-size:14px; color:var(--ink); margin-bottom:4px}
.edcard .ecdesc{font-size:13px; color:var(--slate); line-height:1.5}
.edcadence{font-family:var(--mono); font-size:11px; color:var(--gold); margin-top:12px; letter-spacing:.04em; line-height:1.6}

/* voice ruler */
.voice{display:grid; grid-template-columns:1fr; gap:0; margin-top:4px}
.voice .vline{font-size:14px; line-height:1.55; color:var(--ink); padding:9px 0; border-bottom:1px solid var(--mist)}
.voice .vline:last-child{border-bottom:none}
.voice .vline b{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); display:block; margin-bottom:3px; font-weight:500}

.reminders{background:var(--sapphire); color:var(--bone); border-radius:8px; padding:28px 30px; margin-top:24px}
.reminders .rk{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#C9A55A; margin-bottom:14px}
.reminders ul{list-style:none}
.reminders li{font-size:14px; line-height:1.5; padding:9px 0 9px 20px; position:relative; border-bottom:1px solid rgba(245,242,236,.12)}
.reminders li:last-child{border-bottom:none}
.reminders li::before{content:''; position:absolute; left:0; top:16px; width:6px; height:6px; background:#C9A55A; border-radius:50%}

/* summary block (copy-paste) */
.summary{margin-top:24px}
.summary .shead{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:8px}
.summary .stitle{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--slate)}
.summary .sdesc{font-size:13px; color:var(--slate); margin-bottom:10px; max-width:42em; line-height:1.5}
.btn-copy{background:var(--iron); color:#fff; font-size:12px; font-weight:600; padding:8px 16px; border-radius:5px; letter-spacing:.03em}
.btn-copy:hover{background:#9c3030}
.btn-copy.done{background:var(--gold)}
#summary-text{width:100%; min-height:240px; font-family:var(--mono); font-size:12.5px; line-height:1.6; color:var(--ink); background:#fbfaf7; border:1px solid var(--mist); border-radius:6px; padding:16px; resize:vertical}

.completion{font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--slate); margin-top:18px; padding:12px 0; border-top:1px solid var(--mist); border-bottom:1px solid var(--mist); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
.completion b{color:var(--iron); font-weight:700}
.completion .gaps{color:var(--gold)}

.result-actions{display:flex; gap:12px; margin-top:28px; flex-wrap:wrap}
.btn-line{background:none; border:1px solid var(--mist); color:var(--ink); font-size:14px; font-weight:500; padding:13px 24px; border-radius:6px}
.btn-line:hover{border-color:var(--slate)}

.foot{text-align:center; padding:34px 0 44px}
.foot img{height:30px; width:auto; opacity:.92}
.foot .foot-credit{font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--mist); text-transform:uppercase; margin-top:12px}

@media print{
  #progress-shell,.nav,.result-actions,.summary,.btn-copy,.foot,.result-intro,.completion{display:none!important}
  body{background:#fff}
  .doc,.reminders{border:none; padding:0; margin:0}
  .doc{padding:0}
  .declar{background:none; border-left:2px solid var(--ink); padding:8px 0 8px 18px}
  .edcard{background:none; border:1px solid var(--mist)}
  .reminders{background:none; color:var(--ink); border-top:1px solid var(--mist); padding-top:20px; margin-top:30px}
  .reminders .rk{color:var(--gold)}
  .reminders li{border-color:var(--mist)}
  .reminders li::before{background:var(--gold)}
  .reminders li{color:var(--ink)}
  .screen{padding:0}
  .doc-group{break-inside:avoid}
}
@media(max-width:600px){
  .doc{padding:30px 22px}
  .nav{flex-direction:row}
  .btn-primary{padding:13px 22px; font-size:14px}
}
</style>
</head>
<body>

<div id="progress-shell">
  <div class="wrap">
    <span class="brandmark">Do Feed ao Consultório <b>·</b> Anamnese de Marca</span>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <span id="progress-count">00 / 10</span>
  </div>
</div>

<main class="wrap" id="app"></main>

<div class="foot">
  <img src="logo.png" alt="Do Feed ao Consultório">
  <div class="foot-credit">Laboratório Estratégico</div>
</div>

<script>
/* ---------- CONTEÚDO (extraído da Aula 1) ---------- */
const STEPS = [
  {
    kicker:"Passo 01", key:"visao",
    q:"Qual é a sua visão?",
    help:"Marca não é o terno, o coque, a maquiagem ou um arquétipo. Arquétipo é acessório. A sua marca é a extensão da sua visão, do que você acredita. Comece por aqui.",
    principle:{label:"Princípio da aula", text:["Quando está todo mundo fazendo tudo igual, já não é mais posicionamento. A sua marca e o seu conhecimento são as duas coisas que ninguém rouba de você."]},
    fields:[
      {key:"crenca", label:"O que você acredita sobre a sua área que vai contra o que a maioria faz ou diz?", type:"textarea", dica:"Escreva em primeira pessoa, como uma frase de fé na sua prática. Se a sua resposta serviria para qualquer colega do seu nicho, ela ainda está rasa. Afie até doer um pouco.", ph:"Ex: acredito que saúde vem antes de estética, e que resultado rápido demais costuma cobrar um preço depois."},
    ],
    examples:{label:"Referências da aula", items:[
      "Luciana Seabra defende casa de análise independente, sem conflito de interesse.",
      "Cristian Drummond, cardiologista e ciclista, se posiciona contra anabolizante.",
      "Isabela Lacerda: corpo saudável acima de corpo de palito."
    ]}
  },
  {
    kicker:"Passo 02", key:"valores",
    q:"Seus valores e contra o que você se posiciona",
    help:"Valores aqui não são fé nem crença. São os princípios que guiam a sua prática. E todo posicionamento forte tem um inimigo concreto.",
    principle:{label:"Princípio da aula", text:["Você sempre vai atrair as pessoas que compartilham a mesma visão de mundo que você. Nunca derrube ninguém do muro. A pessoa se joga para o lado que quer por conta própria."]},
    fields:[
      {key:"principios", label:"Quais princípios guiam o seu trabalho?", type:"textarea", dica:"Liste de dois a quatro princípios. Pense no que você nunca abre mão, mesmo quando dá mais trabalho ou custa um paciente.", ph:"Ex: clareza acima de jargão, prevenção acima de remédio, expectativa alinhada acima de promessa fácil."},
      {key:"inimigo", label:"Contra qual prática, status ou conduta do seu mercado você se posiciona?", type:"textarea", dica:"O inimigo é uma prática, não uma pessoa. Aponte a conduta da moda que você considera errada, sem citar nome de colega.", ph:"Ex: contra a cultura de prometer resultado de atleta para quem não vive como atleta."}
    ]
  },
  {
    kicker:"Passo 03", key:"publico",
    q:"Para quem você comunica?",
    help:"Antes de pensar no conteúdo, defina o destinatário. Essa escolha muda tudo o que vem depois.",
    principle:{label:"Princípio da aula", text:["O seu colega não paga você. A sua comunicação é para as pessoas que você serve, não para os pares que fiscalizam o seu trabalho."]},
    fields:[
      {key:"destinatario", type:"single", label:"Você comunica principalmente para:", options:[
        {v:"publico", t:"O público final que eu atendo", h:"O paciente, ou quem indica o paciente. Resposta certa na maioria dos casos."},
        {v:"colega", t:"O colega de profissão", h:"Só faz sentido se você vende para médicos, como cursos ou mentorias."}
      ]},
      {key:"paciente", label:"Descreva o seu paciente médio em poucas linhas.", type:"textarea", dica:"Descreva uma pessoa, não um grupo. Idade, momento de vida, o que já tentou e o que mais incomoda. Quanto mais específico, mais o conteúdo vira ímã.", ph:"Ex: mulher de 35 a 50 anos, que já tentou de tudo para emagrecer e vive no efeito sanfona."}
    ]
  },
  {
    kicker:"Passo 04", key:"mundo_ideal",
    q:"O mundo ideal de quem te procura",
    help:"O paciente chega buscando o mundo ideal dele. Ele chega buscando esperança. O seu papel é mostrar esse mundo ideal, sem prometer o impossível.",
    principle:{label:"Princípio da aula", text:["Esperança é uma das maiores buscas que as pessoas têm. Quem te procura quer ficar livre do incômodo. Você é o caminho para o mundo ideal dela."]},
    fields:[
      {key:"sonho", label:"Qual é o mundo ideal de quem te procura? O que essa pessoa sonha alcançar?", type:"textarea", dica:"Escreva o sonho com as palavras do paciente, não com termo técnico. É a cena que ele imagina quando o problema acaba.", ph:"Ex: parar de engordar e emagrecer em ciclo, e finalmente confiar no espelho."}
    ]
  },
  {
    kicker:"Passo 05", key:"mundo_real",
    q:"O mundo real, sem destruir o sonho",
    help:"O mundo real do paciente quase sempre choca com o mundo ideal. A sua tarefa é trazer a realidade sem dar o não direto. Isso se chama bridging.",
    principle:{label:"Princípio da aula", text:["Você nunca diz que o mundo ideal é impossível. Diz que é possível, e explica do que depende. Esse é o jeito de dizer não sem derrubar a esperança."]},
    fields:[
      {key:"choque", label:"Onde a expectativa do paciente choca com a realidade?", type:"textarea", dica:"Aponte a expectativa irreal que aparece de novo e de novo no consultório. É o ponto onde o sonho esbarra no esforço, no tempo ou na biologia.", ph:"Ex: ele quer resultado de atleta profissional sem ter a rotina de um atleta profissional."},
      {key:"ponte", label:"Como você traz a realidade sem dar o não direto?", type:"textarea", dica:"A ponte sempre começa com um sim. Diga que é possível e explique do que depende. Esse é o seu jeito de dizer não sem derrubar a esperança.", ph:"Ex: é possível, e eu entrego o máximo do meu lado. O quanto você chega depende do esforço que conseguir colocar do seu."}
    ]
  },
  {
    kicker:"Passo 06", key:"diferenciacao",
    q:"Sua diferenciação real",
    help:"O que separa você da média do mercado de verdade. Pode ser a metodologia, o ambiente, a postura, a formação, ou a sua própria história.",
    principle:{label:"Princípio da aula", text:["Guilherme é especialista em obesidade e, na outra ponta, passou quinze anos sendo obeso. A história pessoal que conecta vale mais que qualquer título na parede."]},
    fields:[
      {key:"diferencial", label:"O que te diferencia de verdade da média do mercado?", type:"textarea", dica:"Diferencial não é fazer bem o que todo mundo deveria fazer. É algo que o paciente sente na pele e não acha em qualquer consultório do seu nicho.", ph:"Ex: protocolo de atendimento leve, sem burocracia, com retorno rápido."},
      {key:"autoridade", label:"Qual a sua autoridade técnica? O que você domina que poucos dominam?", type:"textarea", dica:"Aponte o assunto em que você consegue ir mais fundo que a média. Onde você lê o estudo na fonte enquanto os outros repetem o resumo.", ph:"Ex: estudo de drogas de emagrecimento desde antes de virarem moda."},
      {key:"historia", label:"Tem alguma história pessoal que te conecta com o que você faz? (opcional)", type:"textarea", dica:"A história que conecta costuma ser a que você acha banal demais para contar. Se ela explica por que esse problema importa para você, ela vale ouro.", ph:"Ex: vivi na pele o problema que hoje trato nos meus pacientes."}
    ]
  },
  {
    kicker:"Passo 07", key:"show",

const QS=new URLSearchParams(location.search);
const DEMO=QS.get('demo')==='1';
const DEMO_LOOP=QS.get('loop')==='1';

/* ---------- ESTADO ---------- */
let state={nome:""};
let idx=-1; // -1 intro, 0..n-1 steps, n result
const TOTAL=STEPS.length;
const app=document.getElementById('app');
const fill=document.getElementById('progress-fill');
const count=document.getElementById('progress-count');

if(!DEMO){
  try{const saved=localStorage.getItem('anamnese_marca'); if(saved)state=JSON.parse(saved);}catch(e){}
}
function persist(){ if(DEMO) return; try{localStorage.setItem('anamnese_marca',JSON.stringify(state));}catch(e){} }

function setProgress(){
  let pct, lbl;
  if(idx<0){pct=0; lbl="00 / "+pad(TOTAL);}
  else if(idx>=TOTAL){pct=100; lbl=pad(TOTAL)+" / "+pad(TOTAL);}
  else{pct=(idx/TOTAL)*100; lbl=pad(idx+1)+" / "+pad(TOTAL);}
  fill.style.width=pct+"%"; count.textContent=lbl;
}
function pad(n){return String(n).padStart(2,'0');}

/* ---------- RENDER ---------- */
function render(){
  setProgress(); window.scrollTo({top:0,behavior:'smooth'});
  if(idx<0) return renderIntro();
  if(idx>=TOTAL) return renderResult();
  renderStep(STEPS[idx]);
}

function renderStep(s){
  let html=`<section class="screen active">
    <div class="step-kicker">${s.kicker} <span class="of">/ ${pad(TOTAL)}</span></div>
    <h2 class="q">${s.q}</h2>
    <p class="help">${s.help}</p>`;
  if(s.principle){
    html+=`<div class="principle"><span class="plabel">${s.principle.label}</span>${s.principle.text.map(t=>`<p>${t}</p>`).join('')}</div>`;
  }
  s.fields.forEach(f=>{
    html+=`<div class="field">`;
    if(f.type==='textarea'){
      html+=`<label class="flabel" for="${f.key}">${f.label}</label>`;
      if(f.dica) html+=`<p class="dica">${f.dica}</p>`;
      html+=`<textarea id="${f.key}" placeholder="${esc(f.ph||'')}">${esc(state[f.key]||'')}</textarea>`;
    } else if(f.type==='text'){
      html+=`<label class="flabel" for="${f.key}">${f.label}</label>`;
      if(f.dica) html+=`<p class="dica">${f.dica}</p>`;
      html+=`<input type="text" id="${f.key}" placeholder="${esc(f.ph||'')}" value="${esc(state[f.key]||'')}">`;
    } else if(f.type==='single'||f.type==='multi'){
      html+=`<label class="flabel">${f.label}</label>`;
      if(f.dica) html+=`<p class="dica">${f.dica}</p>`;
      html+=`<div class="opts" data-key="${f.key}" data-type="${f.type}"${f.max?` data-max="${f.max}"`:''}>`;
      const cur=state[f.key]||(f.type==='multi'?[]:'');
      f.options.forEach(o=>{
        const sel=f.type==='multi'?cur.includes(o.v):cur===o.v;
        html+=`<div class="opt ${f.type} ${sel?'sel':''}" data-v="${o.v}">
          <div class="box"></div>
          <div class="otext"><b>${o.t}</b>${o.h?`<span class="ohint">${o.h}</span>`:''}</div>
        </div>`;
      });
      html+=`</div>`;
      if(f.type==='multi'){
        const n=Array.isArray(cur)?cur.length:0;
        html+=`<div class="multinote" data-note-for="${f.key}">${multiNoteText(n,f.max)}</div>`;
      }
    }
    html+=`</div>`;
  });
  if(s.examples){
    html+=`<div class="examples"><span class="exlabel">${s.examples.label}</span><ul>${s.examples.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
  }
  html+=`<div class="nav">
      <button class="btn-ghost" id="back">← Voltar</button>
      <button class="btn-primary" id="next">${idx===TOTAL-1?'Ver minha anamnese':'Avançar'}</button>
    </div></section>`;
  app.innerHTML=html;

  s.fields.forEach(f=>{
    if(f.type==='textarea'||f.type==='text'){
      const el=document.getElementById(f.key);
      el.addEventListener('input',e=>{state[f.key]=e.target.value; persist();});
    }
  });
  app.querySelectorAll('.opts').forEach(grp=>{
    const key=grp.dataset.key, type=grp.dataset.type, max=grp.dataset.max?parseInt(grp.dataset.max):null;
    grp.querySelectorAll('.opt').forEach(opt=>{
      opt.onclick=()=>{
        const v=opt.dataset.v;
        if(type==='single'){
          state[key]=v;
          grp.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.v===v));
        } else {
          let arr=state[key]||[]; arr=Array.isArray(arr)?arr.slice():[];
          if(arr.includes(v)){ arr=arr.filter(x=>x!==v); }
          else { if(max && arr.length>=max){ return; } arr.push(v); }
          state[key]=arr;
          grp.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',arr.includes(o.dataset.v)));
          const note=app.querySelector(`[data-note-for="${key}"]`);
          if(note){ note.textContent=multiNoteText(arr.length,max); note.classList.toggle('warn',max&&arr.length>=max); }
        }
        persist();
      };
    });
  });
  document.getElementById('back').onclick=()=>{idx--; render();};
  document.getElementById('next').onclick=()=>{idx++; render();};
}

function multiNoteText(n,max){
  if(n===0) return "Selecione de 3 a 4 eixos.";
  if(max && n>=max) return n+" de "+max+" selecionados. Limite recomendado atingido.";
  if(n<3) return n+" selecionado(s). Escolha pelo menos 3 para ter constância.";
  return n+" selecionados. Pode avançar.";
}

/* monta uma linha do documento */
function docRow(label,val){
  const empty=!val||(Array.isArray(val)&&!val.length);
  return `<div class="doc-sec"><div class="sk">${label}</div>
    <div class="sval ${empty?'empty':''}">${empty?'Não preenchido':esc(val)}</div></div>`;
}

/* declaração de posicionamento sintetizada a partir das respostas */
function buildDeclar(){
  const P=[];
  const dest=state.destinatario==='colega'?'colegas de profissão':(state.destinatario==='publico'?'as pessoas que atendo':'');
  if(state.crenca) P.push("Acredito que "+lc(state.crenca)+".");
  if(state.paciente){
    P.push("Comunico para "+lc(state.paciente)+".");
  } else if(dest){
    P.push("Comunico para "+dest+".");
  }
  if(state.sonho) P.push("Essa pessoa quer "+lc(state.sonho)+".");
  if(state.promessa_central) P.push("A minha promessa é "+lc(state.promessa_central)+".");
  if(state.diferencial) P.push("O que me separa da média: "+lc(state.diferencial)+".");
  if(state.prova) P.push("Em vez de afirmar, eu mostro: "+lc(state.prova)+".");
  if(state.inimigo) P.push("E me posiciono contra "+lc(state.inimigo)+".");
  if(!P.length) return `<p class="empty">Preencha os passos para a sua declaração se montar sozinha aqui.</p>`;
  /* agrupa em até dois parágrafos para leitura */
  const meio=Math.ceil(P.length/2);
  const p1=P.slice(0,meio).join(' ');
  const p2=P.slice(meio).join(' ');
  return `<p>${esc(p1)}</p>`+(p2?`<p>${esc(p2)}</p>`:'');
}

/* deixa a primeira letra minúscula para encaixar no meio da frase, sem cortar acrônimos */
function lc(s){
  s=String(s).trim().replace(/[.;]+$/,'');
  if(!s) return s;
  /* se começa com duas maiúsculas seguidas (sigla), preserva */
  if(/^[A-ZÀ-Ý]{2}/.test(s)) return s;
  return s.charAt(0).toLowerCase()+s.slice(1);
}

function completeness(){
  const checks=[
    ["visão",state.crenca],["valores",state.principios],["inimigo",state.inimigo],
    ["público",state.destinatario],["paciente",state.paciente],["mundo ideal",state.sonho],
    ["choque",state.choque],["ponte",state.ponte],["diferencial",state.diferencial],
    ["autoridade",state.autoridade],["o que mostro",state.prova],["promessa",state.promessa_central],
    ["tom",state.tom],["linhas editoriais",state.editoriais],["preço",state.preco_aceito]
  ];
  let filled=0; const missing=[];
  checks.forEach(c=>{
    const v=c[1]; const ok=v&&(!Array.isArray(v)||v.length);
    if(ok) filled++; else missing.push(c[0]);
  });
  return {pct:Math.round(filled/checks.length*100), missing};
}

/* ---------- HELPERS ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hasAnyAnswer(){return Object.keys(state).some(k=>k!=='nome'&&state[k]&&(!Array.isArray(state[k])||state[k].length));}
function firstUnanswered(){
  for(let i=0;i<STEPS.length;i++){
    const f=STEPS[i].fields[0];
    const v=state[f.key];
    if(!v||(Array.isArray(v)&&!v.length)) return i;
  }
  return 0;
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms/SPEED));
const jit=(base,spread)=>base+Math.floor(Math.random()*spread);

async function typeInto(el,text){
  el.focus();
  el.value='';
  el.dispatchEvent(new Event('input',{bubbles:true}));
  for(const ch of String(text)){
    el.value+=ch;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.scrollTop=el.scrollHeight;
    await sleep(jit(14,12));
  }
  await sleep(jit(150,120));
}

async function clickOpt(grp,v){
  const opt=[...grp.querySelectorAll('.opt')].find(o=>o.dataset.v===v);
  if(!opt) return;
  opt.scrollIntoView({behavior:'smooth',block:'center'});
  await sleep(jit(320,160));
  opt.click();
  await sleep(jit(260,140));
}

async function fillField(f){
  if(f.type==='textarea'||f.type==='text'){
    const el=document.getElementById(f.key);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); await sleep(300); await typeInto(el,DEMO_DATA[f.key]||''); }
  } else {
    const grp=app.querySelector(`.opts[data-key="${f.key}"]`);
    if(!grp) return;
    const val=DEMO_DATA[f.key];
    if(Array.isArray(val)){ for(const v of val){ await clickOpt(grp,v); } }
    else { await clickOpt(grp,val); }
  }
}

async function autoScrollThrough(){
  const dur=9000, steps=130;
  for(let i=0;i<=steps;i++){
    const h=document.body.scrollHeight-window.innerHeight;
    window.scrollTo(0,Math.max(0,h)*(i/steps));
    await sleep(dur/steps);
  }
}

async function runDemo(){
  try{
    await sleep(900);
    const nameEl=document.getElementById('nome');
    if(nameEl){ await typeInto(nameEl,DEMO_DATA.nome); await sleep(500); }
    const start=document.getElementById('start'); if(start) start.click();
    for(let i=0;i<STEPS.length;i++){
      await sleep(jit(650,250));
      for(const f of STEPS[i].fields){ await fillField(f); }
      await sleep(jit(650,250));
      const next=document.getElementById('next'); if(next) next.click();
    }
    await sleep(900);
    await autoScrollThrough();
    const copy=document.getElementById('copybtn');
    if(copy){ copy.scrollIntoView({behavior:'smooth',block:'center'}); await sleep(700); copy.click(); await sleep(1600); }
    window.__demoDone=true;
    if(DEMO_LOOP){
      await sleep(1800);
      state={nome:''}; idx=-1; render(); await sleep(400); runDemo();
    }
  }catch(e){ console.warn('demo:',e); }
}
